name: App CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch_policy:
    name: branch-policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout App policy without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up policy Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.10.0

      - name: Validate pull-request branch topology
        if: github.event_name == 'pull_request'
        env:
          BRANCH_POLICY_REPOSITORY: ${{ github.repository }}
          BRANCH_POLICY_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BRANCH_POLICY_BASE_REF: ${{ github.base_ref }}
          BRANCH_POLICY_HEAD_REF: ${{ github.head_ref }}
        run: node scripts/check-branch-policy.mjs pull-request

      - name: Authenticate protected-branch push as a pull-request merge
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_POLICY_REPOSITORY: ${{ github.repository }}
          BRANCH_POLICY_REF_NAME: ${{ github.ref_name }}
          BRANCH_POLICY_SHA: ${{ github.sha }}
          BRANCH_POLICY_BEFORE_SHA: ${{ github.event.before }}
          BRANCH_POLICY_FORCED: ${{ github.event.forced }}
          BRANCH_POLICY_CREATED: ${{ github.event.created }}
          BRANCH_POLICY_DELETED: ${{ github.event.deleted }}
          BRANCH_POLICY_PULL_REQUESTS_FILE: ${{ runner.temp }}/associated-pull-requests.json
          BRANCH_POLICY_COMMIT_FILE: ${{ runner.temp }}/pushed-commit.json
        run: |
          for attempt in 1 2 3 4 5; do
            if gh api \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" \
                > "$BRANCH_POLICY_COMMIT_FILE" \
              && gh api \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls?per_page=100" \
                > "$BRANCH_POLICY_PULL_REQUESTS_FILE" \
              && jq -e --arg sha "$GITHUB_SHA" \
                'any(.[]; .merge_commit_sha == $sha)' \
                "$BRANCH_POLICY_PULL_REQUESTS_FILE" >/dev/null \
              && node scripts/check-branch-policy.mjs push; then
              exit 0
            fi
            if [[ "$attempt" -eq 5 ]]; then
              node scripts/check-branch-policy.mjs push || true
              exit 1
            fi
            sleep "$((attempt * 2))"
          done

  quality_checks:
    name: quality-checks
    if: >-
      needs.branch_policy.result == 'success'
      && github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    needs:
      - branch_policy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cybergold-app
    steps:
      - name: Checkout App
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: cybergold-app
          persist-credentials: false

      - name: Checkout Protocol release artifacts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CyberGold-io/cybergold-protocol
          ref: 9799b5ac2d3416e6499c3a96c7b2185080527783
          path: cybergold-protocol
          persist-credentials: false

      - name: Checkout Helpers release artifacts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CyberGold-io/cybergold-helpers
          ref: 6484846cae0f697699b1614e75daad9f027dafa1
          path: cybergold-helpers
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.10.0
          cache: npm
          cache-dependency-path: cybergold-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run static, ABI, unit, type, and build checks
        run: node --env-file=tests/fixtures/app.env scripts/run-ci-checks.mjs

      - name: Retain bounded-parallel check logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-quality-check-logs
          path: cybergold-app/out/ci/
          if-no-files-found: warn

  pull_request_checks:
    name: pull-request-checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cybergold-app
    steps:
      - name: Checkout untrusted App change without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: cybergold-app
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.10.0
          cache: npm
          cache-dependency-path: cybergold-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unprivileged source, static, unit, type, and build checks
        run: |
          node scripts/check-branch-policy.mjs --self-test
          npm run check:naming
          npm run check:docs
          npm run check:release-boundaries
          npm run lint
          npm test
          npm run typecheck
          set -a
          source tests/fixtures/app.env
          set +a
          npm run build

  browser_smoke:
    name: browser-smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cybergold-app
    steps:
      - name: Checkout App
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: cybergold-app
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.10.0
          cache: npm
          cache-dependency-path: cybergold-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        env:
          PLAYWRIGHT_BROWSER_SMOKE_PARALLEL: "1"
          PLAYWRIGHT_BROWSER_SMOKE_WORKERS: "2"
        run: |
          set -a
          source tests/fixtures/app.env
          set +a
          npm run test:e2e -- --project=chromium

      - name: Retain Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-browser-smoke-report
          path: cybergold-app/playwright-report/
          if-no-files-found: warn

  dependency_audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cybergold-app
    steps:
      - name: Checkout App
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: cybergold-app
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.10.0
          cache: npm
          cache-dependency-path: cybergold-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production and development dependencies
        run: node scripts/check-dependency-audit.mjs

  quality:
    name: quality
    if: ${{ always() }}
    needs:
      - branch_policy
      - quality_checks
      - pull_request_checks
      - browser_smoke
      - dependency_audit
    runs-on: ubuntu-latest
    steps:
      - name: Require every App quality gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BRANCH_POLICY_RESULT: ${{ needs.branch_policy.result }}
          QUALITY_CHECKS_RESULT: ${{ needs.quality_checks.result }}
          PULL_REQUEST_CHECKS_RESULT: ${{ needs.pull_request_checks.result }}
          BROWSER_SMOKE_RESULT: ${{ needs.browser_smoke.result }}
          DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency_audit.result }}
        run: |
          test "$BRANCH_POLICY_RESULT" = success
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$QUALITY_CHECKS_RESULT" = skipped
            test "$PULL_REQUEST_CHECKS_RESULT" = success
          else
            test "$QUALITY_CHECKS_RESULT" = success
            test "$PULL_REQUEST_CHECKS_RESULT" = skipped
          fi
          for result in "$BROWSER_SMOKE_RESULT" "$DEPENDENCY_AUDIT_RESULT"; do
            test "$result" = "success"
          done

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes on supported public repositories
        if: github.event.repository.private == false
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
      - name: Record the private-repository fallback
        if: github.event.repository.private == true
        run: >-
          echo 'GitHub dependency review is unavailable on the current private Free repository;
          the independent production and development npm audit remains mandatory.'

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks
        run: scripts/install-gitleaks.sh /tmp/gitleaks
      - name: Scan git history
        run: /tmp/gitleaks git . --redact --no-banner --baseline-path scripts/gitleaks-baseline.json

  dispatch_b2b_deployment:
    name: dispatch-b2b-deployment
    if: >-
      ${{
        !cancelled()
        && github.event_name == 'push'
        && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
        && needs.quality.result == 'success'
        && needs['secret-scan'].result == 'success'
      }}
    needs:
      - quality
      - secret-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Dispatch the branch-mapped B2B target
        env:
          GH_TOKEN: ${{ secrets.CYBERGOLD_XREPO_TOKEN }}
        run: |
          case "$GITHUB_REF" in
            refs/heads/main)
              target=mainnet
              ;;
            refs/heads/dev)
              target=sandbox
              ;;
            *)
              exit 1
              ;;
          esac

          gh workflow run publish-b2b-app.yml \
            --repo CyberGold-io/cybergold-ops \
            --ref main \
            -f "target=${target}" \
            -f "app_commit=${GITHUB_SHA}" \
            -f "app_ci_run_id=${GITHUB_RUN_ID}"
